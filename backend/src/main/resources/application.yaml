spring:
  application:
    name: agent-backend
  ai:
    anthropic:
      # Never commit a key: export ANTHROPIC_API_KEY before starting the app.
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        model: claude-opus-5-5
        max-tokens: 64000

server:
  port: 8080

agent:
  system-prompt: >
    You are a helpful assistant. Answer clearly and concisely,
    in the language the user writes in.
