spring:
  application:
    name: agent-backend
  ai:
    openai:
      # Never commit a key: export OPENAI_API_KEY before starting the app.
      api-key: ${OPENAI_API_KEY}
      chat:
        # Talk to the Responses API rather than Chat Completions.
        api: responses
      responses:
        # Used when no model is chosen per message: the summaries of a compaction.
        model: gpt-6.2-sol
      # The starter also provides a DecisionModel bean (OpenAI Decisions API);
      # its model is set with spring.ai.openai.decision.model.
    session:
      repository:
        jdbc:
          # Creates the AI_SESSION* tables on startup if they are missing.
          initialize-schema: always
  datasource:
    # Conversations are kept in a local H2 file, relative to the working directory.
    url: jdbc:h2:file:./data/agent
    username: sa
    password:

server:
  # The API has no authentication yet: it only answers on this machine.
  # Remove this line only once access to it is protected.
  address: 127.0.0.1
  port: 8080

agent:
  # Owner of every conversation: there is no login yet.
  user: local
  system-prompt: >
    You are a helpful assistant. Answer clearly and concisely,
    in the language the user writes in.
    In a long conversation the oldest messages are replaced by a summary:
    use the conversation_search tool when you need a detail that is no longer
    in your context.
  # Models offered in the UI; the first one is the default.
  models:
    - id: gpt-6.2-sol
      label: GPT-6.2 Sol
    - id: gpt-6.2-astra
      label: GPT-6.2 Astra
  reasoning:
    # Efforts offered by the slider, from the lightest to the heaviest, as the
    # Responses API names them (reasoning.effort).
    efforts: [low, medium, high, xhigh]
    default-effort: medium
  # Keep-alive line sent on the event stream while the model is silent; keep it
  # under the idle timeout of any proxy in front of the backend.
  stream-heartbeat: 15s
  compaction:
    # Estimated tokens of the conversation sent to the model at which the
    # oldest turns are summarized...
    trigger-tokens: 60000
    # ...keeping this much of the most recent conversation verbatim.
    keep-tokens: 20000
