spring:
  application:
    name: agent-backend
  ai:
    openai:
      # Never commit a key: export OPENAI_API_KEY before starting the app.
      api-key: ${OPENAI_API_KEY}
      # The longest one call to the model may last, its whole streamed reply included.
      # Spring AI gives it 60 s by default, which cuts a reply the model reasons long
      # on ("Stream failed ... timeout"); this is the default of the OpenAI SDK itself.
      timeout: 10m
      chat:
        # Talk to the Responses API rather than Chat Completions.
        api: responses
      responses:
        # Used when no model is chosen per message: the summaries of a compaction.
        model: gpt-6.2-sol
      # The starter also provides a DecisionModel bean (OpenAI Decisions API);
      # its model is set with spring.ai.openai.decision.model.
    session:
      repository:
        jdbc:
          # Creates the AI_SESSION* tables on startup if they are missing.
          initialize-schema: always
  datasource:
    # Conversations are kept in a local H2 file, relative to the working directory.
    url: jdbc:h2:file:./data/agent
    username: sa
    password:

server:
  # The API has no authentication yet: it only answers on this machine.
  # Remove this line only once access to it is protected.
  address: 127.0.0.1
  port: 8080

agent:
  # Owner of every conversation: there is no login yet.
  user: local
  system-prompt: >
    You are a helpful assistant. Answer clearly and concisely,
    in the language the user writes in.
    In a long conversation the oldest messages are replaced by a summary:
    use the conversation_search tool when you need a detail that is no longer
    in your context.
  # Models offered in the UI; the first one is the default.
  models:
    - id: gpt-6.2-sol
      label: GPT-6.2 Sol
    - id: gpt-6.1-terra
      label: GPT-6.1 Terra
    - id: gpt-6-luna
      label: GPT-6 Luna
  reasoning:
    # Efforts offered by the slider, from the lightest to the heaviest, as the
    # Responses API names them (reasoning.effort).
    efforts: [low, medium, high, xhigh]
    default-effort: medium
    # The model's own summary of its reasoning, shown in the UI while it thinks:
    # auto, concise or detailed (reasoning.summary). Leave empty to ask for none,
    # e.g. if OpenAI refuses summaries to your organization.
    summary: auto
  # Keep-alive line sent on the event stream while the model is silent; keep it
  # under the idle timeout of any proxy in front of the backend.
  stream-heartbeat: 15s
  compaction:
    # Estimated tokens of the conversation sent to the model at which the
    # oldest turns are summarized...
    trigger-tokens: 60000
    # ...keeping this much of the most recent conversation verbatim.
    keep-tokens: 20000
  # The interface of the replies (OpenUI, its open-source part only: no gateway, no key).
  openui:
    # When true the model writes its replies in OpenUI Lang and the frontend draws
    # them (tables, charts, maps, forms). Set to false for plain-text replies.
    enabled: true
    # Generated from the frontend's catalogue: `npm run openui:prompt` in frontend/.
    prompt: classpath:openui/system-prompt.txt
  # Market data tools: those of the EODHD MCP server (https://eodhd.com), reached over
  # Streamable HTTP when the application starts.
  eodhd:
    # Never commit a key: export EODHD_API_KEY before starting the app. Without one
    # the app starts all the same and the model is not given these tools.
    api-key: ${EODHD_API_KEY:}
    # The hosted server takes the key as the apikey parameter of its address, which
    # the backend adds itself; it is never logged nor told to the model.
    base-url: https://mcp.eodhd.com
    endpoint: /v1/mcp
    connect-timeout: 10s
    # One request to the server, a tool call included.
    timeout: 45s
    # Most text one tool result carries to the model, in characters: years of daily
    # prices or a whole fundamentals sheet are cut there.
    max-result-chars: 40000
    # The tools given to the model, among the 70 or so the server has. Each one is
    # sent with every message, so the list is kept to what a conversation about
    # markets needs; add names from the server's list, or leave it empty ([]) for all.
    tools:
      - resolve_ticker
      - get_stocks_from_search
      - get_live_price_data
      - get_historical_stock_prices
      - get_intraday_historical_data
      - get_fundamentals_data
      - get_historical_market_cap
      - get_historical_dividends
      - get_company_news
      - get_sentiment_data
      - get_technical_indicators
      - get_upcoming_earnings
      - get_earnings_trends
      - get_macro_indicator
      - get_economic_events
      - stock_screener
      - get_exchanges_list
    # Added to the system prompt when these tools are on.
    instructions: >
      You have market data tools backed by EODHD: prices (live, daily, intraday),
      fundamentals, dividends, news and sentiment, technical indicators, earnings,
      macro indicators and a stock screener. Use them for any figure about a
      listed company, an index, a currency or an economy rather than answering
      from memory or searching the web. Tickers are written SYMBOL.EXCHANGE
      (AAPL.US, MC.PA): resolve a name to its ticker first when you are not sure
      of it. Ask for no more than the answer needs (a period, a few fields), say
      what date the figures are from, and never present them as advice to buy
      or sell.
  # Dashboards: an interface the agent wrote, kept by the user, that loads its figures
  # by itself through the data tools (the market data ones) each time it is drawn.
  # They are kept in memory: gone when the application stops.
  dashboards:
    # How long the answer of a data tool is given again to an interface that asks the
    # same thing: several panels on one quote, a refresh every few seconds.
    cache: 30s
    # The longest answer of a data tool an interface may load, in characters. Unlike
    # the model, it gets the answer whole or not at all.
    max-result-chars: 2000000
    # Added to the system prompt when interfaces have data tools; {tools} is their names.
    instructions: >
      Data tools an interface can call by itself, with Query: {tools}.
      They are your own tools of the same names and take the same arguments,
      without activity. An interface gets the JSON of the tool whole and as it
      is, where your own call may have been cut. Before you write a Query, call
      the tool yourself with the same arguments, and bind the interface only to
      fields you saw in its result: never guess the shape of an answer. Use a
      Query only for figures that are worth reloading (a quote, a history, a
      screen); what you already know goes in the interface as it is.
  # Web tools, backed by the Linkup API (https://docs.linkup.so).
  linkup:
    # Never commit a key: export LINKUP_API_KEY before starting the app. Without
    # one the app starts all the same and the model is not given the web tools.
    api-key: ${LINKUP_API_KEY:}
    base-url: https://api.linkup.so/v1
    connect-timeout: 5s
    # One call to the API; a deep search takes up to 30 s.
    timeout: 60s
    # Most text one tool result carries to the model, in characters: a fetched
    # page is cut there (the model can read on), the passages of a search share it.
    max-result-chars: 40000
    # Added to the system prompt when the web tools are on.
    instructions: >
      You can search the web with linkup_search and read a page with linkup_fetch.
      Use them whenever the answer depends on recent or checkable facts rather
      than guessing, and cite the URLs of the sources you rely on.
    research:
      # The research agent (linkup_research_start, linkup_research_result): a task
      # runs 2 to 20 minutes and costs 0.25 to 2.50 USD. Set to false to keep the
      # model to search and fetch.
      enabled: true
      # While the model waits for a task: how often it is checked (Linkup
      # rate-limits above one request per second)...
      poll-interval: 5s
      # ...and the longest one tool call waits before reporting it still runs.
      max-wait: 60s
