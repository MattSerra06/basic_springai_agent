<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Agent</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- The sun. The query string makes browsers drop the icon they kept from before. -->
    <link rel="icon" href="favicon.ico?v=4" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=4" />
    <script>
      // The theme chosen by hand, applied before the first paint (see ThemeService).
      try {
        const theme = localStorage.getItem('agent.theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
